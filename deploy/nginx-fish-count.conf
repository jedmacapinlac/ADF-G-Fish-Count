# NOT a standalone site config. This app shares goaflow.org / port 443 with
# the other dashboard, so these two location blocks get pasted INTO the
# existing `server { listen 443 ssl; ... }` block in
# /etc/nginx/conf.d/dashboard.conf, alongside its `location /api/` and
# `location /` blocks — not added as a new server{} or a new file nginx
# reads on its own.
#
# Backend runs on 8001, not 8000 — 8000 is already taken by the other
# dashboard's uvicorn (confirmed via `sudo ss -tlnp` on the box).

    location /fish-count/api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /fish-count/ {
        alias /home/ec2-user/adfg-dash/web/dist/;
        try_files $uri $uri/ =404;
    }
